<svg xmlns="http://www.w3.org/2000/svg" width="420" height="120" viewBox="0 0 420 120" role="img" aria-labelledby="titleDesc">
  <title id="titleDesc">SyncPad logo</title>
  <defs>
    <linearGradient id="g-purple" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#6A4CFF"/>
      <stop offset="1" stop-color="#9B6BFF"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.12" flood-color="#000"/>
    </filter>
  </defs>

  <!-- icon: stylized 'S' formed by two arrows inside rounded square -->
  <g transform="translate(16 10)">
    <rect x="0" y="0" width="96" height="96" rx="18" fill="url(#g-purple)" filter="url(#soft)"/>
    <!-- top arrow (white) -->
    <path d="M24 36c6-6 18-6 24 0l8-8c-10-10-28-10-38 0-10 10-10 26 0 36l8-8c-6-6-6-18 0-24z" fill="#fff" opacity="0.96"/>
    <!-- bottom arrow (transparent cut, showing purple underneath) -->
    <path d="M72 60c-6 6-18 6-24 0l-8 8c10 10 28 10 38 0 10-10 10-26 0-36l-8 8c6 6 6 18 0 24z" fill="#ffffff" opacity="0.18"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(132 70)">
    <text x="0" y="2" font-family="Inter, Roboto, system-ui, -apple-system, 'Segoe UI', Arial" font-weight="700" font-size="36" fill="#1A1A1A">Sync</text>
    <text x="88" y="2" font-family="Inter, Roboto, system-ui, -apple-system, 'Segoe UI', Arial" font-weight="700" font-size="36" fill="#6A4CFF">Pad</text>
    <rect x="0" y="12" width="85" height="2" rx="1" fill="#EDEAFF" />
  </g>
</svg>
